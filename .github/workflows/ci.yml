name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Check generated code and module files are current
        run: |
          go generate ./...
          go mod tidy
          git diff --exit-code

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile for Raspberry Pi (arm64)
        run: GOOS=linux GOARCH=arm64 go build ./...
